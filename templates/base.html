
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}LabelCheck{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <a class="brand" href="{{ url_for('index') }}">LabelCheck</a>
        <nav>
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('scan') }}">Scan Product</a>
            <a href="{{ url_for('history') }}">Scan History</a>
        </nav>
    </header>

    <main class="container">
        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="notice">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <footer>
        Preliminary screening only — verify applicable legal requirements.
    </footer>
</body>
</html>
